type: object
required:
  - _id
  - name
  - gender
  - year
  - ownerId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Student id
    example: 65ca67e7ae7f10c88b598384
  name:
    type: string
    description: Student name
    example: John Doe
  gender:
    type: string
    description: Student name
    enum: ["male", "female"]
  year:
    type: integer
    description: Student year
    example: 2000
  avatar:
    type: integer
    description: Student avatar
    default: null
  onDuty:
    type: boolean
    description: Student on onDuty
    example: false
    default: false
  ownerId:
    type: string
    description: Students owner id
    example: 65ca67e7ae7f10c88b598384
  createdAt:
    type: string
    format: date-time
    example: 2026-01-03T14:42:10.662+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2026-01-03T14:42:10.662+00:00
